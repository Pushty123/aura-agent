# One-click setup on Render (render.com → New → Blueprint → pick this repository).
# Creates the AURA server and a PostgreSQL database for accounts.
# Keys are typed into Render when asked (sync: false); they are never in this file.
services:
  - type: web
    name: aura-server
    runtime: python
    plan: free
    rootDir: relay
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: aura-db
          property: connectionString
      - key: AURA_SECRET
        generateValue: true
      # No email server yet: the 6-digit sign-up code is shown on screen instead.
      - key: AURA_DEV_MODE
        value: "1"
      - key: AURA_LLM_PROVIDER
        value: gemini
      - key: AURA_LLM_KEY
        sync: false
      - key: AURA_ELEVEN_KEY
        sync: false

databases:
  - name: aura-db
    plan: free
    databaseName: aura
    user: aura
